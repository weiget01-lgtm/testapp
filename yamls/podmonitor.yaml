apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: my-app-monitor
  labels:
    release: prometheus # 注意：这里的 label 需要匹配你 kube-prometheus-stack 的 PodMonitor 选择器，通常默认是 release: prometheus 或 release: my-prometheus
spec:
  selector:
    matchLabels:
      app: my-app
  podMetricsEndpoints:
  - port: web # 这里填你 Pod 容器端口定义的 name，你定义的是 "web"
    path: /metrics
    interval: 15s
  namespaceSelector:
    matchNames:
    - app  # 你的应用所在的命名空间



