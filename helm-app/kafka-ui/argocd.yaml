apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/weiget01-lgtm/testapp
    # chart: kubernetes-event-exporter
    targetRevision: main # 建议在生产环境中固定具体版本号，如 "1.7.0"
    path:  helm-app/kafka-ui
    # helm:
    #   releaseName: event-exporter
    #   valueFiles:
    #     - ./event-exporter-values.yaml
          # - $values/event-exporter/values-base.yaml
          # - $values/event-exporter/values-prod.yaml  # 优先级最高，会覆盖上面的同名配置
    # - repoURL: https://github.com/your-org/helm-values.git
    #   targetRevision: main
    #   ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka # 建议的命名空间，需确保存在
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true