# event-exporter-values.yaml
# 启用 Prometheus 指标端点 (Bitnami Chart 内置功能)
metrics:
  enabled: true
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "2112"   # 自监控指标端口

# 核心：Exporter 原生配置
config:
  logLevel: info
  logFormat: json
  clusterName: "in-cluster" # 建议设置，便于多集群场景区分来源

  receivers:
    # 1. Metrics Receiver: 将事件内容转化为 Prometheus 指标
    - name: "metrics-receiver"
      stdout: {} 

  route:
    routes:
      # 只将 Warning 事件路由到 metrics-receiver，控制指标基数
      - match:
          - receiver: "metrics-receiver"
            type: "Warning"
