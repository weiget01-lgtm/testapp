apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qps-based-hpa
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-app   # 替换为你的实际 Deployment 名称
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Pods
    pods:
      metric:
        name: test_http_requests_per_second   # 对应 Adapter 中生成的自定义指标名
      target:
        type: AverageValue
        averageValue: "2"              # 目标：每个 Pod 平均 100 QPS
  behavior:                              # 可选：配置扩缩容行为，避免抖动
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300